<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Быки и коровы</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Быки и коровы</h1>

    <p>Загадано 4 разные цифры. Угадай их!</p>

    <div id="message"></div>

    <input type="text" id="guessInput" maxlength="4" placeholder="Введи 4 цифры">
    <button id="checkBtn">Проверить</button>
    <button id="newGameBtn">Новая игра</button>

    <p>Попыток: <span id="attemptsCount">0</span></p>

    <ul id="historyList"></ul>

    <script src="script.js" defer></script>
</body>

</html>
